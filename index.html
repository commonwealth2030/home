<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voter Registration</title>
	<style>
		:root { --ink:#053371; --muted:#496384; --paper:#ffffff; --surface:#ffffff; --line:#cbd8e7; --accent:#E07320; --accent-dark:#b75a18; --focus:#053371; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Georgia,"Times New Roman",serif; }
		main { width:min(100% - 32px,760px); margin:0 auto; padding:56px 0 72px; }
		.intro { margin-bottom:30px; }
		.eyebrow { margin:0 0 12px; color:var(--accent-dark); font:700 .76rem/1.2 Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
		h1 { max-width:620px; margin:0; font-size:clamp(2.5rem,8vw,4.8rem); font-weight:400; line-height:.98; }
		.intro p:last-child { max-width:520px; margin:20px 0 0; color:var(--muted); font-size:1.1rem; line-height:1.55; }
		form { padding:clamp(24px,5vw,42px); border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 18px 45px rgba(5,51,113,.1); }
		.fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 18px; }
		.field { display:grid; gap:8px; } .field.full { grid-column:1 / -1; }
		label { font:700 .82rem/1.2 Arial,sans-serif; letter-spacing:.04em; }
		input,select { width:100%; min-height:50px; padding:12px 14px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:#fff; font:1rem Georgia,"Times New Roman",serif; }
		input:focus,select:focus { border-color:var(--focus); outline:3px solid rgba(5,51,113,.16); }
		.form-footer { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:32px; }
		button { min-height:50px; padding:0 25px; border:0; border-radius:4px; color:#fff; background:var(--accent); cursor:pointer; font:700 .85rem Arial,sans-serif; letter-spacing:.04em; transition:background 160ms ease,transform 160ms ease; }
		button:hover { background:var(--accent-dark); transform:translateY(-1px); } button:disabled { cursor:wait; opacity:.65; transform:none; }
		#form-status { min-height:1.2em; margin:0; color:var(--muted); font:.9rem/1.4 Arial,sans-serif; }
		#form-status.success { color:var(--focus); } #form-status.error { color:#b75a18; }
		@media (max-width:640px) {
			main { width:min(100% - 24px, 520px); padding:32px 0 48px; }
			h1 { font-size:clamp(2.45rem, 13vw, 3.8rem); }
			.intro p:last-child { font-size:1rem; }
			form { padding:22px 18px 20px; }
			.fields { grid-template-columns:1fr; gap:18px; }
			.field.full { grid-column:auto; }
			input, select { min-height:52px; font-size:16px; }
			.form-footer { align-items:stretch; flex-direction:column-reverse; gap:14px; margin-top:26px; }
			button { width:100%; min-height:54px; }
		}
	</style>
</head>
<body>
	<main>
		<header class="intro">
			<p class="eyebrow">Gettysburg Commonwealth 2030</p>
			<h1>Register as a voter.</h1>
			<p>Enter your information to recieve an email to help you vote on election day.</p>
		</header>
		<form id="residence-form">
			<div class="fields">
				<div class="field"><label for="first-name">First Name</label><input id="first-name" name="firstName" type="text" autocomplete="given-name" required></div>
				<div class="field"><label for="last-name">Last Name</label><input id="last-name" name="lastName" type="text" autocomplete="family-name" required></div>
				<div class="field"><label for="hall">Hall</label><select id="hall" name="hall" required><option value="" selected disabled>Select a hall</option><option>Hanson</option><option>Patrick</option><option>Stine</option><option>Paul</option><option>Stevens</option></select></div>
				<div class="field"><label for="room-number">Room Number</label><input id="room-number" name="roomNumber" type="text" inputmode="numeric" required></div>
				<div class="field full"><label for="school-email">School Email</label><input id="school-email" name="schoolEmail" type="email" autocomplete="email" required></div>
			</div>
			<div class="form-footer"><p id="form-status" role="status" aria-live="polite"></p><button type="submit">Submit information</button></div>
		</form>
	</main>
	<script>
		const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby73TRv1wnTdDbP9VH26SWJrtBuGczYxOzj_3_yv3LOLZKOMNbfZAOatEn4mK3CzBB_/exec";
		const form = document.getElementById("residence-form");
		const status = document.getElementById("form-status");
		const submitButton = form.querySelector("button");
		form.addEventListener("submit", async (event) => {
			event.preventDefault(); status.className = "";
			if (GOOGLE_SCRIPT_URL.startsWith("YOUR_")) { status.textContent = "Add your Google Apps Script web app URL before submitting."; status.className = "error"; return; }
			submitButton.disabled = true; submitButton.textContent = "Submitting..."; status.textContent = "";
			try {
				await fetch(GOOGLE_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(new FormData(form)) });
				status.textContent = "Your information has been submitted."; status.className = "success"; form.reset();
			} catch (error) { status.textContent = "Something went wrong. Please try again."; status.className = "error"; }
			finally { submitButton.disabled = false; submitButton.textContent = "Submit information"; }
		});
	</script>
</body>
</html>
